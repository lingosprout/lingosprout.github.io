<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LingoSprout — How it's grown</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff;
    --text: #1c1c1e;
    --muted: #666;
    --accent: #2e8b2e;
    --line: #e5e5ea;
    --card: #f6f6f7;
    --shadow: rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --text: #e5e5e7; --muted: #9a9aa0; --accent: #6cb86c;
      --line: #333; --card: #26262a; --shadow: rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6; margin: 0; color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 56px 20px 80px; }
  header.page { text-align: center; margin-bottom: 12px; }
  header.page h1 { font-size: 2.2rem; margin: 0 0 .3rem; }
  header.page p.tag { font-size: 1.1rem; color: var(--muted); margin: 0; }
  nav.top { text-align: center; margin: 22px 0 44px; }
  nav.top a { color: var(--accent); text-decoration: none; margin: 0 12px; font-size: .95rem; }
  nav.top a:hover { text-decoration: underline; }

  .batch { margin-bottom: 64px; }
  .batch-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px;
    border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 8px;
  }
  .batch-head h2 { font-size: 1.5rem; margin: 0; }
  .badge {
    font: 500 .78rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 9px; white-space: nowrap;
  }
  .badge.tag { color: var(--accent); border-color: var(--accent); }
  .note { color: var(--muted); margin: 6px 0 18px; max-width: 68ch; }

  .devices { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .devices button {
    font: inherit; font-size: .88rem; cursor: pointer; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; transition: background .15s, border-color .15s;
  }
  .devices button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }

  .grid {
    display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .grid.tablet { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  figure { margin: 0; }
  figure a { display: block; }
  figure img {
    width: 100%; height: auto; border-radius: 14px; border: 1px solid var(--line);
    box-shadow: 0 6px 20px var(--shadow); background: var(--card); display: block;
  }
  figcaption { text-align: center; font-size: .82rem; color: var(--muted); margin-top: 8px; }

  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; margin-top: 40px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <header class="page">
      <h1>🌱 How LingoSprout has grown</h1>
      <p class="tag">A visual timeline of the app, snapshot by snapshot.</p>
    </header>
    <nav class="top">
      <a href="/">Home</a>
      <a href="/support">Support</a>
      <a href="/privacy">Privacy</a>
    </nav>
    <main id="timeline"><p class="empty">Loading…</p></main>
    <footer>
      Each snapshot is captured from the iOS Simulator and pinned to the commit that produced it.
    </footer>
  </div>

<script>
const BASE = "shots";

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid) n.append(kid);
  return n;
}

function renderBatch(batch, cfg) {
  const screens = cfg.screens;
  const deviceMeta = Object.fromEntries(cfg.devices.map(d => [d.id, d]));
  const available = (batch.devices && batch.devices.length) ? batch.devices : cfg.devices.map(d => d.id);

  const section = el("section", { class: "batch" });

  const head = el("div", { class: "batch-head" }, el("h2", {}, document.createTextNode(batch.date)));
  if (batch.tag) head.append(el("span", { class: "badge tag" }, document.createTextNode(batch.tag)));
  if (batch.commit) head.append(el("span", { class: "badge" }, document.createTextNode(batch.commit)));
  section.append(head);
  if (batch.note) section.append(el("p", { class: "note" }, document.createTextNode(batch.note)));

  const grid = el("div", { class: "grid" });
  const isTablet = id => id.startsWith("ipad");
  const setDevice = (id) => {
    grid.classList.toggle("tablet", isTablet(id));
    grid.replaceChildren(...screens.map(s => {
      const src = `${BASE}/${batch.date}/${id}/${s.file}`;
      const img = el("img", { src, alt: `${s.label} — ${deviceMeta[id]?.label || id}`, loading: "lazy" });
      return el("figure", {},
        el("a", { href: src, target: "_blank", rel: "noopener" }, img),
        el("figcaption", {}, document.createTextNode(s.label)));
    }));
  };

  const picker = el("div", { class: "devices" });
  available.forEach((id, i) => {
    const btn = el("button", {
      type: "button",
      "aria-pressed": i === 0 ? "true" : "false",
      onclick: () => {
        picker.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
        setDevice(id);
      }
    }, document.createTextNode(deviceMeta[id]?.label || id));
    picker.append(btn);
  });

  section.append(picker, grid);
  setDevice(available[0]);
  return section;
}

fetch(`${BASE}/manifest.json`, { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(cfg => {
    const timeline = document.getElementById("timeline");
    if (!cfg.batches || !cfg.batches.length) {
      timeline.replaceChildren(el("p", { class: "empty" }, document.createTextNode("No snapshots yet.")));
      return;
    }
    const sorted = [...cfg.batches].sort((a, b) => (a.date < b.date ? 1 : -1));
    timeline.replaceChildren(...sorted.map(b => renderBatch(b, cfg)));
  })
  .catch(err => {
    document.getElementById("timeline").replaceChildren(
      el("p", { class: "empty" }, document.createTextNode("Couldn't load the timeline (" + err.message + ").")));
  });
</script>
</body>
</html>
